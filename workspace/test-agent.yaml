version: "16"

models:
  horizon-model:
    provider: google
    model: gemini-3.5-flash-lite

agents:
  root:
    model: horizon-model
    description: Isolated sandbox verification agent
    instruction: |
      Goal:
      Confirm the isolated Horizon runtime is available.

      Instructions:
      Respond concisely in two bullet points confirming that you are online and ready to receive tasks.